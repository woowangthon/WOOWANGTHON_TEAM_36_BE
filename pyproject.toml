[project]
name = "scholarship-backend"
version = "0.1.0"
description = "장학금 매칭 서비스 backend (수집·AI 추출·DB·인증·규칙 엔진·웹 API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.5",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "olefile>=0.47",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]

[tool.ruff.lint.isort]
# 저장소의 alembic/ 폴더(마이그레이션)와 alembic 패키지를 헷갈리지 않게 합니다.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
